<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AggRO - Ses & Sohbet</title>
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" id="pwa-manifest">
  <style>
    :root {
      --bg-dark: #0f1117;
      --bg-panel: #161922;
      --bg-card: #1f2430;
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --success: #23a55a;
      --danger: #f23f43;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

    /* Giriş Ekranı */
    #login-screen {
      position: fixed; inset: 0; background: var(--bg-dark); display: flex;
      align-items: center; justify-content: center; z-index: 100;
    }
    .login-box {
      background: var(--bg-panel); padding: 32px; border-radius: 14px; width: 370px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5); text-align: center; border: 1px solid #2b2f3c;
    }
    .login-box h1 { font-size: 28px; margin-bottom: 6px; color: #fff; letter-spacing: 0.5px; }
    .login-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .login-box input {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #2e3340;
      background: var(--bg-card); color: #fff; font-size: 15px; outline: none; margin-bottom: 12px;
    }
    .login-box input:focus { border-color: var(--accent); }
    .btn {
      padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer;
      font-weight: 600; font-size: 14px; transition: 0.15s; color: #fff; background: var(--accent);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    #login-error { color: var(--danger); font-size: 13px; margin-bottom: 12px; display: none; line-height: 1.4; }

    /* Ana Düzen */
    #app { display: none; width: 100%; height: 100%; }
    .sidebar {
      width: 310px; background: var(--bg-panel); display: flex; flex-direction: column;
      border-right: 1px solid #232733;
    }
    .brand {
      padding: 14px 16px; font-weight: 800; font-size: 19px; border-bottom: 1px solid #232733;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .brand-btns { display: flex; gap: 6px; }
    .user-list { flex: 1; overflow-y: auto; padding: 12px; }
    .section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin: 8px 6px; }
    
    .user-card {
      background: var(--bg-card); padding: 10px 12px; border-radius: 10px; margin-bottom: 8px;
      border: 1px solid transparent; transition: 0.15s;
    }
    .user-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .user-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); }
    .dm-badge { font-size: 11px; background: #2b3040; padding: 2px 7px; border-radius: 5px; color: var(--text-muted); }
    .user-header:hover .dm-badge { background: var(--accent); color: #fff; }
    .vol-control { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
    .vol-control input { flex: 1; accent-color: var(--accent); cursor: pointer; }

    /* Sol Alt Kontrol Paneli */
    .controls-panel {
      padding: 12px; background: #11131a; border-top: 1px solid #232733; display: flex; flex-direction: column; gap: 8px;
    }
    .control-row { display: flex; gap: 6px; }
    .control-row .btn { flex: 1; padding: 8px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .fx-select {
      width: 100%; padding: 8px; border-radius: 6px; background: var(--bg-card);
      color: #fff; border: 1px solid #2e3340; font-size: 12px; outline: none;
    }

    /* Orta Panel */
    .main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
    .top-bar {
      height: 54px; border-bottom: 1px solid #232733; display: flex; align-items: center;
      justify-content: space-between; padding: 0 20px; background: var(--bg-panel);
    }
    .chat-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: var(--bg-card); color: var(--text-muted); border: none; padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    /* Görüntü Alanı */
    #media-stage {
      display: none; background: #090a0d; padding: 12px; gap: 12px; flex-wrap: wrap;
      justify-content: center; border-bottom: 1px solid #232733; max-height: 45vh; overflow-y: auto;
    }
    .video-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; height: 220px; border: 1px solid #2b2f3c; }
    .video-box video { height: 100%; width: auto; display: block; }
    .video-label {
      position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.7);
      padding: 3px 8px; border-radius: 4px; font-size: 12px;
    }

    /* Mesajlar */
    .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: var(--bg-panel); padding: 10px 14px; border-radius: 10px; max-width: 75%; align-self: flex-start; border: 1px solid #1e222d; }
    .msg.mine { background: #1e2640; border-color: #2e3b66; align-self: flex-end; }
    .msg.dm { border-left: 3px solid #f0b232; }
    .msg-info { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: flex; gap: 8px; }
    .msg-author { font-weight: 700; color: #fff; }
    .msg-text { font-size: 14px; line-height: 1.4; word-break: break-word; }

    .chat-input-area {
      padding: 14px 20px; background: var(--bg-panel); border-top: 1px solid #232733;
      display: flex; gap: 10px;
    }
    .chat-input-area input {
      flex: 1; background: var(--bg-card); border: 1px solid #2e3340; padding: 12px 16px;
      border-radius: 8px; color: #fff; font-size: 14px; outline: none;
    }
    .chat-input-area input:focus { border-color: var(--accent); }

    /* Ayarlar Modalı */
    #settings-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
      align-items: center; justify-content: center; z-index: 90;
    }
    .modal-content {
      background: var(--bg-panel); padding: 24px; border-radius: 12px; width: 420px;
      border: 1px solid #2e3340; display: flex; flex-direction: column; gap: 14px;
    }
    .modal-content label { font-size: 12px; color: var(--text-muted); font-weight: 600; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: 44%; border-right: none; border-bottom: 1px solid #232733; }
      .main-area { height: 56%; }
    }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-screen">
    <div class="login-box">
      <h1>⚡ AggRO</h1>
      <p>Hafif, Şifreli Ses & Sohbet Odası</p>
      <div id="login-error"></div>
      <input type="text" id="nickname-input" placeholder="Nickname yaz..." maxlength="18" autocomplete="off">
      <button class="btn" style="width:100%" id="join-btn">Sunucuya Bağlan</button>
      <button class="btn" id="install-btn-login" style="width:100%; margin-top:8px; background:#2b3040; display:none;" onclick="installPWA()">
        📥 Masaüstüne / Telefona İndir
      </button>
    </div>
  </div>

  <!-- ANA UYGULAMA -->
  <div id="app">
    <div class="sidebar">
      <div class="brand">
        <span>⚡ AggRO</span>
        <div class="brand-btns">
          <button class="btn" id="install-btn-nav" style="padding:6px 10px; font-size:12px; background:var(--success); display:none;" onclick="installPWA()">📥 İndir</button>
          <button class="btn" style="padding:6px 10px; font-size:12px; background:#2b3040;" onclick="openSettings()">⚙️ Cihazlar</button>
        </div>
      </div>

      <div class="user-list">
        <div class="section-title">Odadaki Kişiler (Özel mesaj için tıkla)</div>
        <div id="users-container"></div>
      </div>

      <!-- SES & DJ KONTROLLERİ -->
      <div class="controls-panel">
        <div class="control-row">
          <button class="btn btn-success" id="mic-btn" onclick="toggleMic()">🎤 Mikrofon Açık</button>
          <button class="btn" style="background:#2b3040;" id="music-btn" onclick="toggleMusicShare()">🎵 Müzik Dinlet</button>
        </div>
        <div id="music-vol-row" style="display:none; align-items:center; gap:8px; font-size:12px; color:var(--text-muted);">
          <span>🎵 Müzik Sesi:</span>
          <input type="range" min="0" max="1.5" step="0.05" value="0.5" style="flex:1" oninput="setMusicVolume(this.value)">
        </div>
        <div class="control-row">
          <button class="btn" style="background:#2b3040;" id="cam-btn" onclick="toggleVideo('cam')">📷 Kamera</button>
          <button class="btn" style="background:#2b3040;" id="screen-btn" onclick="toggleVideo('screen')">🖥️ Ekran Paylaş</button>
        </div>
        <select class="fx-select" id="voice-fx" onchange="changeVoiceEffect(this.value)">
          <option value="none">🎭 Ses Değiştirici: Kapalı (Sıfır Yük)</option>
          <option value="chipmunk">🐿️ Sincap / Helyum Sesi</option>
          <option value="monster">👹 Dev / Canavar Sesi</option>
          <option value="robot">🤖 Robot / Telsiz Sesi</option>
          <option value="cave">🦇 Mağara Yankısı (Echo)</option>
        </select>
      </div>
    </div>

    <div class="main-area">
      <div class="top-bar">
        <div class="chat-tabs">
          <button class="tab-btn active" id="tab-general" onclick="switchChatTarget('ALL')">🌐 Genel Sohbet</button>
          <button class="tab-btn" id="tab-dm" style="display:none;" onclick="switchChatTarget(window.currentDmTarget)"></button>
        </div>
        <span style="font-size:12px; color:var(--text-muted);">🔒 AggRO Uçtan Uca Şifreli</span>
      </div>

      <div id="media-stage"></div>
      <div class="messages" id="messages-box"></div>

      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Genel sohbete mesaj yaz..." autocomplete="off">
        <button class="btn" onclick="sendMessage()">Gönder</button>
      </div>
    </div>
  </div>

  <!-- CİHAZ VE DENETİM MASASI AYARLARI -->
  <div id="settings-modal">
    <div class="modal-content">
      <h3>⚙️ AggRO Ses Cihazları & Ayarlar</h3>
      <div>
        <label>Mikrofon Seçimi:</label>
        <select class="fx-select" id="mic-select" onchange="switchAudioDevice()"></select>
      </div>
      <div>
        <label>Hoparlör / Kulaklık Seçimi:</label>
        <select class="fx-select" id="speaker-select" onchange="switchSpeakerDevice()"></select>
      </div>
      <hr style="border:0; border-top:1px solid #2b2f3c;">
      <button class="btn" style="background:#2b3040;" onclick="window.location.href='ms-settings:sound'">
        🎛️ Windows Ses Denetim Masasını Aç
      </button>
      <button class="btn btn-danger" onclick="closeSettings()">Kapat</button>
    </div>
  </div>

  <script>
    // PWA (Masaüstüne ve Telefona Uygulama Olarak İndirme) Kurulumu
    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#5865f2"/><text x="50" y="68" font-size="52" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-weight="bold">A</text></svg>`;
    const iconUrl = "data:image/svg+xml;base64," + btoa(iconSvg);
    const manifest = {
      name: "AggRO Ses & Sohbet",
      short_name: "AggRO",
      start_url: location.href,
      display: "standalone",
      background_color: "#0f1117",
      theme_color: "#5865f2",
      icons: [{ src: iconUrl, sizes: "192x192", type: "image/svg+xml" }, { src: iconUrl, sizes: "512x512", type: "image/svg+xml" }]
    };
    document.getElementById("pwa-manifest").href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));

    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("install-btn-login").style.display = "block";
      document.getElementById("install-btn-nav").style.display = "inline-block";
    });
    window.installPWA = async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else {
        alert("Tarayıcının adres çubuğunun sağ üst köşesindeki 'Yükle' (Bilgisayar/İndirme) simgesine tıklayarak AggRO'yu masaüstüne indirebilirsin!");
      }
    };
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, onChildAdded, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyClToAMIoQr_a_VBbnnBgc8ZTa1e9pnwhY",
      authDomain: "aggro-b4671.firebaseapp.com",
      databaseURL: "https://aggro-b4671-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "aggro-b4671",
      storageBucket: "aggro-b4671.firebasestorage.app",
      messagingSenderId: "997464038847",
      appId: "1:997464038847:web:71dd110bc5d7c2ada7d50a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myNick = "";
    let myId = "u_" + Math.random().toString(36).substring(2, 10);
    let chatTarget = "ALL";
    window.currentDmTarget = "";

    let audioCtx = null;
    let rawMicStream = null;
    let musicStream = null;
    let videoStream = null;
    let outboundDest = null;
    let micSource = null;
    let micGainNode = null;
    let musicGainNode = null;
    let activeFxNodes = [];
    let isMicMuted = false;

    const peers = {};
    const allMessages = [];
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    const enc = (str) => btoa(unescape(encodeURIComponent(str.split('').map(c => String.fromCharCode(c.charCodeAt(0) ^ 42)).join(''))));
    const dec = (str) => { try { return decodeURIComponent(escape(atob(str))).split('').map(c => String.fromCharCode(c.charCodeAt(0) ^ 42)).join(''); } catch(e){ return str; } };

    document.getElementById("join-btn").addEventListener("click", attemptLogin);
    document.getElementById("nickname-input").addEventListener("keydown", e => { if(e.key === "Enter") attemptLogin(); });
    document.getElementById("chat-input").addEventListener("keydown", e => { if(e.key === "Enter") window.sendMessage(); });

    async function attemptLogin() {
      const input = document.getElementById("nickname-input").value.trim();
      const errBox = document.getElementById("login-error");
      const btn = document.getElementById("join-btn");
      if (!input) return;

      errBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Sunucuya bağlanılıyor...";

      try {
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("TIMEOUT")), 7000));
        const snap = await Promise.race([get(ref(db, "users")), timeout]);
        const users = snap.val() || {};
        const taken = Object.values(users).some(u => u.nick && u.nick.toLowerCase() === input.toLowerCase());

        if (taken) {
          errBox.textContent = "Bu nickname şu an içeride kullanılıyor, başka bir tane seç!";
          errBox.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Sunucuya Bağlan";
          return;
        }

        myNick = input;
        await initAudioEngine();

        const myRef = ref(db, "users/" + myId);
        await set(myRef, { nick: myNick, joinedAt: Date.now() });
        onDisconnect(myRef).remove();
        onDisconnect(ref(db, "signals/" + myId)).remove();

        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "flex";

        setupRealtimeListeners();
      } catch (err) {
        console.error(err);
        errBox.innerHTML = "<b>Sunucu izni kapalı!</b><br>Firebase > Realtime Database > Kurallar (Rules) kısmından <b>.read: true</b> ve <b>.write: true</b> yapıp Yayınla butonuna basmalısın.";
        errBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sunucuya Bağlan";
      }
    }

    async function initAudioEngine(deviceId = null) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (!outboundDest) outboundDest = audioCtx.createMediaStreamDestination();

        const constraints = {
          audio: deviceId ? { deviceId: { exact: deviceId }, echoCancellation: true, noiseSuppression: true }
                          : { echoCancellation: true, noiseSuppression: true }
        };
        if (rawMicStream) rawMicStream.getTracks().forEach(t => t.stop());
        rawMicStream = await navigator.mediaDevices.getUserMedia(constraints);

        if (micSource) micSource.disconnect();
        micSource = audioCtx.createMediaStreamSource(rawMicStream);
        if (!micGainNode) micGainNode = audioCtx.createGain();
        micGainNode.gain.value = isMicMuted ? 0 : 1;

        applyVoiceEffectChain(document.getElementById("voice-fx").value);
      } catch (err) {
        console.warn("Mikrofon bulunamadı veya izin verilmedi, dinleyici modunda devam ediliyor.");
      }
    }

    function applyVoiceEffectChain(effect) {
      if (!audioCtx || !micSource) return;
      micSource.disconnect();
      activeFxNodes.forEach(n => { try { n.disconnect(); if(n.stop) n.stop(); } catch(e){} });
      activeFxNodes = [];

      if (effect === "none") {
        micSource.connect(micGainNode);
      } else if (effect === "chipmunk") {
        const filter = audioCtx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 600;
        const peaker = audioCtx.createBiquadFilter();
        peaker.type = "peaking";
        peaker.frequency.value = 1800;
        peaker.gain.value = 12;
        micSource.connect(filter);
        filter.connect(peaker);
        peaker.connect(micGainNode);
        activeFxNodes.push(filter, peaker);
      } else if (effect === "monster") {
        const low = audioCtx.createBiquadFilter();
        low.type = "lowshelf";
        low.frequency.value = 320;
        low.gain.value = 16;
        const shaper = audioCtx.createWaveShaper();
        const curve = new Float32Array(44100);
        for (let i = 0; i < 44100; i++) { const x = (i * 2) / 44100 - 1; curve[i] = Math.tanh(x * 3); }
        shaper.curve = curve;
        micSource.connect(low);
        low.connect(shaper);
        shaper.connect(micGainNode);
        activeFxNodes.push(low, shaper);
      } else if (effect === "robot") {
        const osc = audioCtx.createOscillator();
        const ringGain = audioCtx.createGain();
        osc.frequency.value = 55;
        osc.type = "sawtooth";
        osc.start();
        osc.connect(ringGain.gain);
        micSource.connect(ringGain);
        ringGain.connect(micGainNode);
        activeFxNodes.push(osc, ringGain);
      } else if (effect === "cave") {
        const delay = audioCtx.createDelay();
        delay.delayTime.value = 0.22;
        const feedback = audioCtx.createGain();
        feedback.gain.value = 0.45;
        delay.connect(feedback);
        feedback.connect(delay);
        micSource.connect(micGainNode);
        micSource.connect(delay);
        delay.connect(micGainNode);
        activeFxNodes.push(delay, feedback);
      }
      micGainNode.connect(outboundDest);
    }

    window.changeVoiceEffect = (val) => applyVoiceEffectChain(val);

    window.toggleMic = () => {
      isMicMuted = !isMicMuted;
      if (micGainNode) micGainNode.gain.value = isMicMuted ? 0 : 1;
      const btn = document.getElementById("mic-btn");
      btn.textContent = isMicMuted ? "🔇 Mikrofon Kapalı" : "🎤 Mikrofon Açık";
      btn.className = isMicMuted ? "btn btn-danger" : "btn btn-success";
    };

    window.toggleMusicShare = async () => {
      const btn = document.getElementById("music-btn");
      const volRow = document.getElementById("music-vol-row");
      if (musicStream) {
        musicStream.getTracks().forEach(t => t.stop());
        musicStream = null;
        btn.style.background = "#2b3040";
        btn.textContent = "🎵 Müzik Dinlet";
        volRow.style.display = "none";
        return;
      }
      try {
        musicStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const audioTrack = musicStream.getAudioTracks()[0];
        musicStream.getVideoTracks().forEach(t => t.stop());
        if (!audioTrack) {
          alert("Müzik sesinin gelmesi için paylaşım ekranında 'Sekme sesini paylaş / Sistem sesini paylaş' kutucuğunu işaretlemelisin!");
          musicStream = null;
          return;
        }
        const mSource = audioCtx.createMediaStreamSource(new MediaStream([audioTrack]));
        musicGainNode = audioCtx.createGain();
        musicGainNode.gain.value = 0.5;
        mSource.connect(musicGainNode);
        musicGainNode.connect(outboundDest);

        btn.style.background = "var(--success)";
        btn.textContent = "🎵 Müzik Yayında";
        volRow.style.display = "flex";
        audioTrack.onended = () => window.toggleMusicShare();
      } catch (e) {}
    };

    window.setMusicVolume = (val) => { if (musicGainNode) musicGainNode.gain.value = parseFloat(val); };

    window.toggleVideo = async (type) => {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
        removeVideoBox("local");
        document.getElementById("cam-btn").style.background = "#2b3040";
        document.getElementById("screen-btn").style.background = "#2b3040";
        Object.values(peers).forEach(p => replacePeerVideo(p.pc, null));
        return;
      }
      try {
        videoStream = type === "cam"
          ? await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360 } })
          : await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 } });

        const vTrack = videoStream.getVideoTracks()[0];
        addVideoBox("local", videoStream, myNick + " (Sen)");
        document.getElementById(type === "cam" ? "cam-btn" : "screen-btn").style.background = "var(--success)";

        Object.entries(peers).forEach(([pid, p]) => replacePeerVideo(p.pc, vTrack, pid));
        vTrack.onended = () => window.toggleVideo(type);
      } catch (e) {}
    };

    async function replacePeerVideo(pc, track, pid) {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if (sender && track) {
        sender.replaceTrack(track);
      } else if (track && pid) {
        pc.addTrack(track, videoStream);
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        push(ref(db, "signals/" + pid), { from: myId, nick: myNick, sdp: pc.localDescription });
      }
    }

    function addVideoBox(id, stream, label) {
      const stage = document.getElementById("media-stage");
      stage.style.display = "flex";
      let box = document.getElementById("vbox_" + id);
      if (!box) {
        box = document.createElement("div");
        box.className = "video-box";
        box.id = "vbox_" + id;
        box.innerHTML = `<video autoplay playsinline ${id==='local'?'muted':''}></video><div class="video-label">${label}</div>`;
        stage.appendChild(box);
      }
      box.querySelector("video").srcObject = stream;
    }

    function removeVideoBox(id) {
      const box = document.getElementById("vbox_" + id);
      if (box) box.remove();
      const stage = document.getElementById("media-stage");
      if (stage.children.length === 0) stage.style.display = "none";
    }

    function setupRealtimeListeners() {
      onValue(ref(db, "users"), (snap) => {
        const users = snap.val() || {};
        renderUserList(users);

        if (Object.keys(users).length === 0) remove(ref(db, "messages"));

        Object.entries(users).forEach(([uid, uData]) => {
          if (uid !== myId && !peers[uid] && myId < uid) {
            createPeerConnection(uid, uData.nick, true);
          }
        });

        Object.keys(peers).forEach(pid => {
          if (!users[pid]) {
            if (peers[pid].pc) peers[pid].pc.close();
            if (peers[pid].audioEl) peers[pid].audioEl.remove();
            removeVideoBox(pid);
            delete peers[pid];
          }
        });
      });

      onChildAdded(ref(db, "signals/" + myId), async (snap) => {
        const msg = snap.val();
        remove(snap.ref);
        if (!msg) return;

        let peer = peers[msg.from];
        if (!peer) peer = createPeerConnection(msg.from, msg.nick, false);

        if (msg.sdp) {
          await peer.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
          if (msg.sdp.type === "offer") {
            const answer = await peer.pc.createAnswer();
            await peer.pc.setLocalDescription(answer);
            push(ref(db, "signals/" + msg.from), { from: myId, nick: myNick, sdp: peer.pc.localDescription });
          }
        } else if (msg.candidate) {
          try { await peer.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch(e){}
        }
      });

      onChildAdded(ref(db, "messages"), (snap) => {
        const m = snap.val();
        if (!m) return;
        if (m.to === "ALL" || m.to === myNick || m.from === myNick) {
          allMessages.push(m);
          renderMessages();
        }
      });
    }

    function createPeerConnection(peerId, peerNick, isOfferer) {
      const pc = new RTCPeerConnection(rtcConfig);
      const peerObj = { pc, nick: peerNick, gainNode: null, audioEl: null };
      peers[peerId] = peerObj;

      if (outboundDest) {
        outboundDest.stream.getAudioTracks().forEach(t => pc.addTrack(t, outboundDest.stream));
      }
      if (videoStream) {
        videoStream.getVideoTracks().forEach(t => pc.addTrack(t, videoStream));
      }

      pc.onicecandidate = (e) => {
        if (e.candidate) push(ref(db, "signals/" + peerId), { from: myId, nick: myNick, candidate: e.candidate });
      };

      pc.ontrack = (e) => {
        if (e.track.kind === "audio") {
          const stream = new MediaStream([e.track]);
          const audio = new Audio();
          audio.srcObject = stream;
          audio.muted = true;
          audio.play().catch(()=>{});

          const src = audioCtx.createMediaStreamSource(stream);
          const gain = audioCtx.createGain();
          gain.gain.value = 1;
          src.connect(gain);
          gain.connect(audioCtx.destination);
          peerObj.gainNode = gain;
          peerObj.audioEl = audio;
        } else if (e.track.kind === "video") {
          const vStream = new MediaStream([e.track]);
          addVideoBox(peerId, vStream, peerNick);
          e.track.onended = () => removeVideoBox(peerId);
        }
      };

      if (isOfferer) {
        pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
          push(ref(db, "signals/" + peerId), { from: myId, nick: myNick, sdp: pc.localDescription });
        });
      }
      return peerObj;
    }

    function renderUserList(users) {
      const container = document.getElementById("users-container");
      container.innerHTML = "";
      Object.entries(users).forEach(([uid, u]) => {
        const isMe = uid === myId;
        const card = document.createElement("div");
        card.className = "user-card";
        card.innerHTML = `
          <div class="user-header" ${!isMe ? `onclick="switchChatTarget('${u.nick}')"` : ""}>
            <div class="user-name"><span class="status-dot"></span> ${u.nick} ${isMe ? "(Sen)" : ""}</div>
            ${!isMe ? `<span class="dm-badge">💬 Özel Yaz</span>` : ""}
          </div>
          ${!isMe ? `
          <div class="vol-control">
            <span>🔊</span>
            <input type="range" min="0" max="2" step="0.05" value="1" oninput="setUserVolume('${uid}', this.value)">
          </div>` : ""}
        `;
        container.appendChild(card);
      });
    }

    window.setUserVolume = (uid, val) => {
      if (peers[uid] && peers[uid].gainNode) {
        peers[uid].gainNode.gain.value = parseFloat(val);
      }
    };

    window.switchChatTarget = (target) => {
      chatTarget = target;
      const tabGen = document.getElementById("tab-general");
      const tabDm = document.getElementById("tab-dm");
      const input = document.getElementById("chat-input");

      if (target === "ALL") {
        tabGen.classList.add("active");
        tabDm.classList.remove("active");
        input.placeholder = "Genel sohbete mesaj yaz...";
      } else {
        window.currentDmTarget = target;
        tabDm.style.display = "inline-block";
        tabDm.textContent = "🔒 Özel: " + target;
        tabDm.classList.add("active");
        tabGen.classList.remove("active");
        input.placeholder = `${target} kişisine özel mesaj yaz...`;
      }
      renderMessages();
    };

    window.sendMessage = () => {
      const input = document.getElementById("chat-input");
      const txt = input.value.trim();
      if (!txt) return;
      push(ref(db, "messages"), {
        from: myNick,
        to: chatTarget,
        text: enc(txt),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      input.value = "";
    };

    function renderMessages() {
      const box = document.getElementById("messages-box");
      box.innerHTML = "";
      allMessages.filter(m => {
        if (chatTarget === "ALL") return m.to === "ALL";
        return (m.from === myNick && m.to === chatTarget) || (m.from === chatTarget && m.to === myNick);
      }).forEach(m => {
        const div = document.createElement("div");
        const isMine = m.from === myNick;
        div.className = `msg ${isMine ? 'mine' : ''} ${m.to !== 'ALL' ? 'dm' : ''}`;
        div.innerHTML = `
          <div class="msg-info">
            <span class="msg-author">${m.from} ${m.to !== 'ALL' ? '➔ ' + m.to : ''}</span>
            <span>${m.time}</span>
          </div>
          <div class="msg-text">${dec(m.text)}</div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    window.openSettings = async () => {
      document.getElementById("settings-modal").style.display = "flex";
      const devices = await navigator.mediaDevices.enumerateDevices();
      const micSel = document.getElementById("mic-select");
      const spkSel = document.getElementById("speaker-select");
      micSel.innerHTML = ""; spkSel.innerHTML = "";

      devices.forEach(d => {
        if (d.kind === "audioinput") {
          micSel.innerHTML += `<option value="${d.deviceId}">${d.label || 'Mikrofon'}</option>`;
        } else if (d.kind === "audiooutput") {
          spkSel.innerHTML += `<option value="${d.deviceId}">${d.label || 'Hoparlör'}</option>`;
        }
      });
    };

    window.closeSettings = () => document.getElementById("settings-modal").style.display = "none";
    window.switchAudioDevice = () => initAudioEngine(document.getElementById("mic-select").value);
    window.switchSpeakerDevice = async () => {
      const devId = document.getElementById("speaker-select").value;
      if (audioCtx && audioCtx.setSinkId) await audioCtx.setSinkId(devId);
    };
  </script>
</body>
